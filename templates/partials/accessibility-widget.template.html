<!--
  Shared accessibility widget: the floating button, its backdrop and the
  accessibility menu. The build localizes every label from
  js/accessibility-copy.js; js/accessibility.js runs it.
-->
<button class="a11y-fab" id="a11y-fab" type="button" aria-controls="a11y-panel" aria-expanded="false" aria-haspopup="dialog" aria-label="Open accessibility menu" title="Open accessibility menu">
  <svg class="a11y-fab__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <circle cx="12" cy="3.9" r="2.3" fill="currentColor"/>
    <path d="M4.2 8.1c2.6.8 5.2 1.2 7.8 1.2s5.2-.4 7.8-1.2M12 9.4v4.9m0 0-3.4 7.3m3.4-7.3 3.4 7.3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div class="a11y-backdrop" id="a11y-backdrop" aria-hidden="true"></div>

<div class="a11y-panel" id="a11y-panel" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="a11y-title" aria-describedby="a11y-description" tabindex="-1">
  <div class="a11y-panel__header">
    <p class="a11y-panel__eyebrow" id="a11y-eyebrow">Accessibility</p>
    <button class="a11y-panel__close" id="a11y-close" type="button" aria-label="Close accessibility menu">
      <span aria-hidden="true">✕</span>
    </button>
  </div>

  <h2 class="a11y-panel__title" id="a11y-title">Accessibility menu</h2>
  <p class="a11y-panel__description" id="a11y-description">Adjust the site to the way you read and navigate. Your choices are kept on this device.</p>

  <div class="a11y-panel__status-row">
    <span class="a11y-panel__status" id="a11y-status" role="status">Standard site view</span>
    <button class="a11y-panel__reset" id="a11y-reset" type="button">Reset all</button>
  </div>

  <div class="a11y-text-size" role="group" aria-labelledby="a11y-text-size-title">
    <span class="a11y-option__copy">
      <span class="a11y-option__title" id="a11y-text-size-title">Text size</span>
      <span class="a11y-option__description" id="a11y-text-size-description">Enlarge the text across the site.</span>
    </span>
    <span class="a11y-text-size__controls">
      <button class="a11y-text-size__step" id="a11y-text-smaller" type="button" dir="ltr" aria-label="Smaller text">A−</button>
      <output class="a11y-text-size__value" id="a11y-text-size-value" aria-live="polite">100%</output>
      <button class="a11y-text-size__step" id="a11y-text-larger" type="button" dir="ltr" aria-label="Larger text">A+</button>
    </span>
  </div>

  <div class="a11y-options">
    <button class="a11y-option" type="button" data-a11y-setting="highContrast" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">High contrast</span>
        <span class="a11y-option__description">Dark text on a light background with strong borders.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="grayscale" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Grayscale</span>
        <span class="a11y-option__description">Show the site without colors.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="underlineLinks" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Highlight links</span>
        <span class="a11y-option__description">Underline and mark every link.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="readableFont" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Readable font</span>
        <span class="a11y-option__description">A plain, highly legible font.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="textSpacing" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Text spacing</span>
        <span class="a11y-option__description">More space between lines, words and letters.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="highlightHeadings" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Highlight headings</span>
        <span class="a11y-option__description">Mark the headings to show the page structure.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="bigCursor" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Large cursor</span>
        <span class="a11y-option__description">A larger mouse pointer.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="focusHighlight" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Strong focus indicator</span>
        <span class="a11y-option__description">A thick outline around the element in keyboard focus.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
    <button class="a11y-option" type="button" data-a11y-setting="reducedMotion" aria-pressed="false">
      <span class="a11y-option__copy">
        <span class="a11y-option__title">Stop animations</span>
        <span class="a11y-option__description">Stop animations, transitions and the background video.</span>
      </span>
      <span class="a11y-option__switch" aria-hidden="true"></span>
    </button>
  </div>

  <a class="a11y-panel__statement" id="a11y-statement" href="/accessibility/">Accessibility statement</a>
</div>
