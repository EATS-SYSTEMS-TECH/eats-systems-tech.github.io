<!-- Shared site navigation. Labels and URLs come from scripts/site-navigation.mjs. -->
<header class="site-header" id="top">
  <script>try{for(var i=0;i<sessionStorage.length;i++)if(/^firebase:authUser:[^:]+:\[DEFAULT\]$/.test(sessionStorage.key(i))){document.getElementById("top").classList.add("site-header--account");break}}catch(e){}</script>
  <nav class="nav" aria-label="Main navigation">
    <a href="/" class="nav__logo-link nav__brand" aria-label="WIFIGATE">
      <img src="/assets/img/wifigate-horizontal-logo.webp" alt="WIFIGATE" class="nav__logo" width="416" height="96">
    </a>
    <button class="nav__toggle" aria-label="Toggle navigation menu" aria-controls="primary-navigation" aria-expanded="false">
      <span class="nav__toggle-bar"></span>
      <span class="nav__toggle-bar"></span>
      <span class="nav__toggle-bar"></span>
    </button>
    <div class="nav__links-wrapper" id="primary-navigation">
      <div class="topbar-nav"></div>
    </div>
    <a class="site-login__trigger" href="/login/" aria-label="Log in"><span class="site-login__label">Log in</span><svg class="site-login__icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg></a>
    <div class="site-account">
      <button type="button" class="site-account__button" id="account-button" aria-label="Account menu" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu">
        <span class="site-account__avatar" aria-hidden="true"></span>
        <span class="site-account__arrow" aria-hidden="true">▾</span>
      </button>
      <div class="site-account__panel" hidden>
        <div class="site-account__identity">
          <span class="site-account__label">Signed in as</span>
          <span class="site-account__name" dir="auto"></span>
          <span class="site-account__email" dir="ltr"></span>
        </div>
        <div class="site-account__menu" id="account-menu" role="menu" aria-labelledby="account-button">
          <a class="site-account__item" role="menuitem" tabindex="-1" href="/dashboard/" data-account-dashboard>My dashboard</a>
          <button type="button" class="site-account__item" role="menuitem" tabindex="-1" data-account-sign-out>Sign out</button>
        </div>
      </div>
    </div>
    <button class="site-cart__trigger" type="button" aria-label="Shopping cart" aria-controls="site-cart-drawer" aria-haspopup="dialog" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 1.9-1.5L21 8H6" />
        <circle cx="10" cy="20" r="1" /><circle cx="18" cy="20" r="1" />
      </svg>
      <span class="site-cart__count" aria-hidden="true" hidden></span>
    </button>
    <div class="language-selector">
      <button type="button" class="language-selector__button" id="language-button" aria-label="Select language">
        <span class="language-selector__flag" id="selected-flag"></span>
        <span class="language-selector__selected"></span>
        <span class="language-selector__arrow" aria-hidden="true">▾</span>
      </button>
      <div class="language-selector__dropdown" id="language-dropdown"></div>
    </div>
  </nav>
</header>
<div class="site-cart__backdrop" hidden></div>
<aside class="site-cart__drawer" id="site-cart-drawer" role="dialog" aria-modal="true" aria-labelledby="site-cart-title" tabindex="-1" hidden>
  <div class="site-cart__heading">
    <h2 id="site-cart-title">Your cart</h2>
    <button class="site-cart__close" type="button" aria-label="Close cart">×</button>
  </div>
  <div class="site-cart__body">
    <p class="site-cart__empty">Your cart is empty.</p>
    <ul class="site-cart__items" aria-live="polite" hidden></ul>
  </div>
  <div class="site-cart__footer">
    <div class="site-cart__subtotal"><span>Estimated subtotal</span><strong>—</strong></div>
    <button class="site-cart__checkout" type="button" disabled>Checkout coming soon</button>
    <p class="site-cart__note">Online shopping will be available soon.</p>
  </div>
</aside>
