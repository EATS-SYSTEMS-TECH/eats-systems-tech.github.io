<!--
  templates/partials/site-footer.template.html
  THE single source of truth for the site footer. Every page template carries
  only `<div data-partial="site-footer"></div>`; the build swaps that for this
  markup (see injectPartials in scripts/build-localized-site.mjs), so the
  footer can never drift between the homepage, the use-case pages, the
  WIFIGATE Automation page and the legal pages.

  Editing rules:
  - Keep the three legal links as the 1st/2nd/3rd children of
    `.site-footer__links`, and the three `.site-footer__heading` elements in
    the order legal / app-and-support / social. updateFooterStaticUi() and
    applyHomepageCopy() localise them by position.
  - Keep the `../` prefix on the legal hrefs and on asset paths; the build
    rewrites both to the right depth per locale and page.
  - `data-i18n` attributes are build-time markers only. js/i18n.js is stripped
    from every generated page, so they are inert in the shipped HTML.
  - `dir` is overwritten per locale by updateFooterStaticUi().
-->
<footer class="site-footer" dir="ltr">

          decoding="async">
      </div>
      <p class="site-footer__brand-copy" data-i18n="footer.tagline" dir="ltr">No keys. No remotes. No cards.
Secure digital access, without waiting for anyone to let you in.</p>
