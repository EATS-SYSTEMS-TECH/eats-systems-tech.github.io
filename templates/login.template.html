<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>{{pageTitle}} | WIFIGATE</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/host-portal.css?v=20261008c" />
    <link rel="stylesheet" href="/css/login-gate-game.css?v=20261008b" />
    <script type="module" src="/js/host-login.js?v=20261008c"></script>
    <link rel="stylesheet" href="/css/cookie-consent.css?v=20261007c" />
  </head>
  <body class="portal-login app-login">
    <main class="app-login__screen">
      <section class="app-login__card" aria-labelledby="login-title">
        <h1 id="login-title" class="visually-hidden">{{heading}}</h1>
        <a class="app-login__logo" href="{{homeHref}}" aria-label="{{home}}"
          ><img
            src="/assets/img/wifigate-login-logo.png"
            alt="WIFIGATE"
            width="280"
            height="190"
        /></a>
        <button
          type="button"
          class="app-login__language"
          aria-haspopup="dialog"
          aria-controls="language-picker"
          aria-label="{{chooseLanguage}}. {{currentLabel}}"
        >
          <img
            src="/assets/img/flags/{{currentFlag}}"
            alt=""
            width="33"
            height="22"
          />
          <span>{{currentLabel}}</span>
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path
              d="M5 7.5l5 5 5-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="app-login__actions">
          <button
            type="button"
            class="app-login__provider app-login__provider--google"
            data-provider="google"
            disabled
          >
            <svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M473.16 221.48l-2.26-9.59H262.46v88.22H387c-12.93 61.4-72.93 93.72-121.94 93.72-35.66 0-73.25-15-98.13-39.11a140.08 140.08 0 01-41.8-98.88c0-37.16 16.7-74.33 41-98.78s61-38.13 97.49-38.13c41.79 0 71.74 22.19 82.94 32.31l62.69-62.36C390.86 72.72 340.34 32 261.6 32c-60.75 0-119 23.27-161.58 65.71C58 139.5 36.25 199.93 36.25 256s20.58 113.48 61.3 155.6c43.51 44.92 105.13 68.4 168.58 68.4 57.73 0 112.45-22.62 151.45-63.66 38.34-40.4 58.17-96.3 58.17-154.9 0-24.67-2.48-39.32-2.59-39.96z"
              />
            </svg>
            <span>{{google}}</span>
          </button>
          <button
            type="button"
            class="app-login__provider app-login__provider--apple"
            data-provider="apple"
            disabled
          >
            <svg viewBox="0 0 512 512" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M349.13 136.86c-40.32 0-57.36 19.24-85.44 19.24-28.79 0-50.75-19.1-85.69-19.1-34.2 0-70.67 20.88-93.83 56.45-32.52 50.16-27 144.63 25.67 225.11 18.84 28.81 44 61.12 77 61.47h.6c28.68 0 37.2-18.78 76.67-19h.6c38.88 0 46.68 18.89 75.24 18.89h.6c33-.35 59.51-36.15 78.35-64.85 13.56-20.64 18.6-31 29-54.35-76.19-28.92-88.43-136.93-13.08-178.34-23-28.8-55.32-45.48-85.79-45.48z"
              />
              <path
                fill="currentColor"
                d="M340.25 32c-24 1.63-52 16.91-68.4 36.86-14.88 18.08-27.12 44.9-22.32 70.91h1.92c25.56 0 51.72-15.39 67-35.11 14.72-19.01 25.88-45.95 21.8-72.66z"
              />
            </svg>
            <span>{{apple}}</span>
          </button>
        </div>
        <div
          id="login-progress"
          class="app-login__progress"
          role="progressbar"
          aria-label="{{signingInLabel}}"
          hidden
        >
          <span></span>
        </div>
        <p
          id="login-status"
          class="app-login__status"
          role="status"
          aria-live="polite"
        ></p>
        <div class="staging-note" data-staging hidden>
          <strong>{{stagingTitle}}</strong>
          <p>{{stagingText}}</p>
          <code>admin@wifigate.test</code><code>owner@grandplaza.test</code
          ><code>pending@wifigate.test</code>
        </div>
        <p class="app-login__legal">{{legal}}</p>
      </section>
    </main>
    <dialog
      id="language-picker"
      class="language-picker"
      aria-labelledby="language-picker-title"
    >
      <div class="language-picker__box">
        <div class="language-picker__head">
          <h2 id="language-picker-title">{{chooseLanguage}}</h2>
          <button
            type="button"
            class="language-picker__close"
            aria-label="{{close}}"
            data-close
          >
            ×
          </button>
        </div>
        <ul class="language-picker__list">
{{languageOptions}}
        </ul>
      </div>
    </dialog>
    <dialog id="mfa-challenge" aria-labelledby="challenge-title">
      <form>
        <h2 id="challenge-title">{{mfaTitle}}</h2>
        <p>{{mfaText}}</p>
        <label>{{mfaFactor}}<select name="factor" required></select></label>
        <label
          >{{mfaCode}}<input
            name="code"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            required
        /></label>
        <p role="status" aria-live="polite"></p>
        <div class="form-actions">
          <button type="submit">{{mfaVerify}}</button
          ><button type="button" data-cancel>{{mfaCancel}}</button>
        </div>
        <p class="help-text">{{mfaHelp}}</p>
      </form>
    </dialog>
    <script type="application/json" id="login-copy">{{runtimeCopy}}</script>
    <script src="/js/cookie-consent-copy.js?v=20261007c" defer></script>
    <script src="/js/cookie-consent.js?v=20261007c" defer></script>
  </body>
</html>
