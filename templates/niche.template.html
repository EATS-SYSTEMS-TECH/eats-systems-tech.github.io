<body class='niche-page'>
  <!-- Keyboard users enter main directly; shared navigation is injected at build time. -->
  <a href='#main-content' class='skip-link'>Skip to main content</a>
  <div data-partial="site-header"></div>

  <main id='main-content' class='niche-main'>
    <!-- The hero retains one eager image, its overlay and the content layer. -->
    <section aria-labelledby='niche-title' class='niche-hero'>
      <div class='niche-hero__media'>
        <img id='niche-image' class='niche-hero__bg' alt='' width='1280' height='720'
             loading='eager' fetchpriority='high' decoding='async'
             src='../assets/wifigate_niche_pages/hotels-airbnb-v2-app-hero.webp'>
        <div class='niche-hero__overlay'></div>
      </div>
      <div class='niche-hero__content container'>
        <!-- Breadcrumb and circular use-case navigation occupy the original top bar. -->
        <div class='niche-hero__topbar'>
          <nav aria-label='Breadcrumb' class='niche-breadcrumb'>
            <ol class='niche-breadcrumb__list'>
              <li class='niche-breadcrumb__item'>
                <a id='niche-breadcrumb-home' href='../index.html#home' class='niche-breadcrumb__link'>Home</a>
              </li>
              <li aria-current='page' class='niche-breadcrumb__item'>
                <span id='niche-breadcrumb-current'>Use case</span>
              </li>
            </ol>
          </nav>
          <div class='niche-hero__pager'>
            <a id='niche-prev-link' href='../sports-facilities/' title='Previous use case'
               aria-label='Previous use case' class='niche-hero__nav-button niche-hero__nav-button--prev'>
              <svg focusable='false' aria-hidden='true' viewBox='0 0 24 24' class='niche-hero__nav-icon'>
                <path d='M14.5 5L8 12L14.5 19'></path>
              </svg>
            </a>
            <a id='niche-next-link' href='../roller-shutters/' title='Next use case'
               aria-label='Next use case' class='niche-hero__nav-button niche-hero__nav-button--next'>
              <svg focusable='false' aria-hidden='true' viewBox='0 0 24 24' class='niche-hero__nav-icon'>
                <path d='M9.5 5L16 12L9.5 19'></path>
              </svg>
            </a>
          </div>
        </div>

        <!-- The builder fills the optional lead and proof without changing the two actions. -->
        <div class='niche-hero__text'>
          <p id='niche-eyebrow' class='niche-hero__eyebrow'>WIFIGATE use case</p>
          <h1 id='niche-title' class='niche-hero__title'>Smart access control for this use case</h1>
          <p hidden id='niche-hero-lead' class='niche-hero__lead'></p>
          <div class='niche-hero__actions'>
            <a target='_blank' rel='noopener noreferrer' href='https://wa.me/message/NZWNMX6V2XVHJ1'
               class='btn btn--primary niche-hero__btn-primary'>
              <span id='niche-hero-cta-label'>Contact via WhatsApp</span>
            </a>
            <a id='niche-hero-benefits' href='#niche-benefits' class='btn btn--ghost niche-hero__btn-secondary'>Key benefits</a>
          </div>
          <ul id='niche-hero-proof' class='niche-hero__proof'></ul>
        </div>
      </div>
    </section>

    <!-- Highlights stay absent until a locale supplies complete entries. -->
    <section hidden id='niche-highlights' class='niche-highlights'>
      <div class='container'>
        <div id='niche-highlights-list' class='niche-highlights__grid'></div>
      </div>
    </section>

    <!-- Keep the labelled benefits target and its ordered generated card list. -->
    <section aria-labelledby='niche-benefits-title' id='niche-benefits' class='niche-section'>
      <div class='container'>
        <div class='niche-section__header'>
          <h2 id='niche-benefits-title' class='niche-section__title'>Key benefits</h2>
        </div>
        <ul id='niche-benefits-list' class='bento'></ul>
      </div>
    </section>

    <!-- The existing FAQ behavior receives localized details in this list. -->
    <section aria-labelledby='niche-faq-title' id='niche-faq' class='niche-section seo-faq'>
      <div class='container seo-faq__layout'>
        <div class='niche-section__header'>
          <h2 id='niche-faq-title' class='niche-section__title'>Frequently asked questions</h2>
        </div>
        <div id='niche-faq-list' class='seo-faq__list'></div>
      </div>
    </section>
  </main>

  <!-- Preserve the exact placeholder syntax consumed by shared partial injection. -->
  <div data-partial="site-footer"></div>
  <div data-partial="accessibility-widget"></div>
</body>
</html>
