    <style>
        :root {
            --bg: #edf2f8;
            --panel: #ffffff;
            --text: #152238;
            --muted: #526176;
            --accent: #0b63ff;
            --accent-strong: #2563eb;
            --border: #d9e2ee;
            --shadow: 0 18px 48px rgba(25, 50, 90, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 20px;
        }

        .card {
            width: min(100%, 400px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 32px 28px;
            text-align: center;
        }

        .logo {
            --logo-edge: 84px;
            inline-size: var(--logo-edge);
            block-size: var(--logo-edge);
            border-radius: calc(var(--logo-edge) * 2 / 7);
            display: block;
            margin: 0 auto 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 6vw, 30px);
            line-height: 1.18;
        }

        p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.55;
        }

        .spinner {
            width: 24px;
            height: 24px;
            margin: 28px auto 0;
            border: 3px solid #dce7f8;
            border-top-color: var(--accent-strong);
            border-radius: 50%;
            animation: spin 850ms linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }

        [hidden] { display: none !important; }

        .statement {
            margin: 0;
            font-size: 14px;
        }

        .statement a {
            color: var(--muted);
            text-underline-offset: 0.15em;
        }

        .demo-banner {
            margin: 20px 0 0;
            padding: 12px 14px;
            border-radius: 14px;
            background: #fef3c7;
            color: #92400e;
            font-size: 15px;
            font-weight: 700;
        }

        .demo-phone {
            max-width: 300px;
            margin: 20px auto 0;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 28px;
            background: #f8fafc;
        }

        .demo-tile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 6px 16px rgba(25, 50, 90, 0.08);
            text-align: start;
        }

        .demo-icon {
            display: grid;
            flex: none;
            place-items: center;
            width: 52px;
            height: 52px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #f8fafc;
        }

        .demo-icon img {
            width: 36px;
            height: 36px;
        }

        .demo-tile div {
            min-width: 0;
        }

        .demo-name {
            margin: 0;
            color: var(--text);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .demo-guest {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.04em;
        }

        .demo-window {
            margin: 12px 0 0;
            color: #2563eb;
            font-size: 14px;
            font-weight: 700;
        }

        .demo-when {
            white-space: nowrap;
        }

        .actions {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .button,
        .secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .button {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.20);
        }

        .secondary {
            border: 1px solid var(--border);
            color: var(--text);
            background: #ffffff;
        }

        .button:hover,
        .secondary:hover {
            transform: translateY(-1px);
        }

        .button:focus-visible,
        .secondary:focus-visible {
            outline: 3px solid #173d91;
            outline-offset: 3px;
        }

        .feedback {
            min-height: 24px;
            margin-top: 12px;
            font-size: 14px;
        }

        .feedback:empty { display: none; }

        .feedback.error { color: #a32626; }

        @media (max-width: 360px) {
            body { padding: 14px; }
            .card { padding: 28px 20px; }
        }
    </style>
    <script id="wifigate-link-copy" type="application/json">{"headingFallback":"在 WIFIGATE 中開啟","headingMissing":"在 WIFIGATE 中開啟","statusMissing":"此邀請連結缺少存取資訊。請要求傳送者重新分享。","statusFallback":"如果 WIFIGATE 沒有自動開啟，請使用下方按鈕。","copyButton":"複製應用程式連結","copiedButton":"已複製應用程式連結","copyError":"Couldn't copy link. Please try again."}</script>
    <script>
        const WIFIGATE_LINK_DEFAULT_COPY = {
            headingFallback: "Continue in WIFIGATE",
            statusMissing: "This invitation link is missing the access details. Ask the sender to share it again.",
            statusFallback: "Didn't open automatically? Tap below to try again.",
            copyButton: "Copy link",
            copiedButton: "Link copied!",
            copyError: "Couldn't copy link. Please try again."
        };

        function getUtilityPageCopy() {
            const script = document.getElementById("wifigate-link-copy");
            if (!script) {
                return WIFIGATE_LINK_DEFAULT_COPY;
            }

            try {
                return {
                    ...WIFIGATE_LINK_DEFAULT_COPY,
                    ...JSON.parse(script.textContent || "{}")
                };
            } catch (error) {
                return WIFIGATE_LINK_DEFAULT_COPY;
            }
        }

        // Choose the first meaningful alias while retaining the original query's order.
        const firstRouteValue = (values) =>
            values.find((value) => typeof value === "string" && value.trim())?.trim() || "";

        // Resolve an invitation target from the public parameter and path aliases.
        function invitationTarget(url) {
            const query = url.searchParams;
            const segments = url.pathname.split("/").filter(Boolean).map((component) => {
                try { return decodeURIComponent(component); } catch { return ""; }
            });
            const choices = [
                { route: "dual-control", aliases: ["dcid", "dualControlId"], canonical: "dcid" },
                { route: "group", aliases: ["gid", "groupId"], canonical: "gid" },
                { route: "gate", aliases: ["i", "id", "chip"], canonical: null }
            ];

            for (const choice of choices) {
                const pathId = segments[0] === choice.route ? segments[1] : "";
                const id = firstRouteValue([...choice.aliases.map((key) => query.get(key)), pathId]);
                if (id) return { ...choice, id };
            }
            return query.get("ep") ? { ...choices[2], id: "invite" } : null;
        }

        // Direct links win; otherwise build the app route without discarding opaque parameters.
        const buildDeepLink = () => {
            const url = new URL(window.location.href);
            const query = url.searchParams;
            if (isDemoLink(query)) return "";

            const direct = firstRouteValue([query.get("link")]);
            if (direct) return direct;

            const target = invitationTarget(url);
            if (!target) return "";

            query.delete("link");
            if (target.canonical && !query.has(target.canonical)) query.set(target.canonical, target.id);
            if (!query.has("id")) query.set("id", target.id);
            const suffix = query.toString();
            return `wifigate://${target.route}/${encodeURIComponent(target.id)}${suffix ? "?" + suffix : ""}`;
        };
        // Replace the waiting state with recovery actions, or explain that no route exists.
        const revealFallback = (deepLink) => {
            const copy = getUtilityPageCopy();
            const title = document.getElementById("page-title");
            const status = document.getElementById("status");
            const spinner = document.getElementById("spinner");
            const openApp = document.getElementById("open-app");
            const copyLink = document.getElementById("copy-link");
            const feedback = document.getElementById("feedback");

            title.textContent = deepLink ? copy.headingFallback : copy.headingMissing;
            status.textContent = deepLink ? copy.statusFallback : copy.statusMissing;
            spinner.hidden = true;
            // Both recovery actions appear together only when a usable route exists.
            for (const action of [openApp, copyLink]) action.hidden = !deepLink;
            openApp.setAttribute("href", deepLink || "#");
            copyLink.textContent = copy.copyButton;
            copyLink.onclick = async function () {
                if (!deepLink) {
                    return;
                }

                feedback.textContent = "";
                feedback.classList.remove("error");
                try {
                    await navigator.clipboard.writeText(deepLink);
                    feedback.textContent = copy.copiedButton;
                } catch (error) {
                    feedback.textContent = copy.copyError;
                    feedback.classList.add("error");
                }
            };
        };
        // Hand off to the app first; recovery actions appear once the page is visible again.
        const scheduleAppOpen = (deepLink) => {
            if (!deepLink) return revealFallback("");

            // Restore the manual recovery actions after the operating system handoff.
            const showRecovery = () => {
                if (document.visibilityState === "visible") {
                    revealFallback(deepLink);
                } else {
                    document.addEventListener("visibilitychange", function showOnReturn() {
                        if (document.visibilityState === "visible") {
                            document.removeEventListener("visibilitychange", showOnReturn);
                            revealFallback(deepLink);
                        }
                    });
                }
            };
            window.setTimeout(showRecovery, 900);

            // Keep the immediate opening attempt separate from the recovery timer.
            window.setTimeout(() => window.location.replace(deepLink), 40);
        };

        // A demo guest link from the WIFIGATE Host examples (ep=v1.demo_…)
        // carries only which example and the stay window. It shows what a
        // guest would see and never opens the app.
        const WIFIGATE_DEMO_PREFIX = "v1.demo_";
        const WIFIGATE_DEMO_SYSTEMS = {
            room: { name: "Example WIFIGATE Room 212 🥂🍾", icon: "gate-bed-outline" },
            dual: { name: "Example WIFIGATE Dual Control 212 🥂🍾", icon: "dual-control-barrier-gate-small" },
            roller: { name: "Example WIFIGATE Roller Shutter 212 🥂🍾", icon: "dual-control-roller-shutter-small" },
            group: { name: "Example WIFIGATE Group 212 🥂🍾", icon: "group-hosting" }
        };
        const WIFIGATE_DEMO_COPY = {
            en: {
                title: "Example guest link",
                banner: "Example: this link doesn't open a gate.",
                guest: "GUEST",
                incomplete: "This example link is incomplete.",
                more: "About WIFIGATE"
            },
            he: {
                title: "קישור לדוגמה לאורח",
                banner: "דוגמה: הקישור הזה לא פותח שער.",
                guest: "אורח",
                incomplete: "קישור הדוגמה הזה לא שלם.",
                more: "על WIFIGATE"
            }
        };

        function isDemoLink(params) {
            return params.getAll("ep").some(function (value) {
                return value.indexOf(WIFIGATE_DEMO_PREFIX) === 0;
            }) || params.getAll("link").some(function (value) {
                return value.indexOf(WIFIGATE_DEMO_PREFIX) !== -1;
            });
        }

        function readDemoToken(ep) {
            try {
                const encoded = ep.slice(WIFIGATE_DEMO_PREFIX.length).replace(/-/g, "+").replace(/_/g, "/");
                const value = JSON.parse(atob(encoded + "===".slice((encoded.length + 3) % 4)));
                const keys = Object.keys(value || {}).sort().join(",");
                if (keys !== "k,se,ss" || !Object.prototype.hasOwnProperty.call(WIFIGATE_DEMO_SYSTEMS, value.k) ||
                    !Number.isSafeInteger(value.ss) || !Number.isSafeInteger(value.se) || value.se <= value.ss) {
                    return null;
                }
                return value;
            } catch (error) {
                return null;
            }
        }

        function demoElement(tag, className, text) {
            const element = document.createElement(tag);
            if (className) {
                element.className = className;
            }
            if (text !== undefined) {
                element.textContent = text;
            }
            return element;
        }

        function showDemoPreview() {
            const params = new URL(window.location.href).searchParams;
            if (!isDemoLink(params)) {
                return false;
            }
            const pageLanguage = (document.documentElement.lang || "en").slice(0, 2);
            const language = pageLanguage === "he" ||
                (pageLanguage === "en" && (navigator.language || "").slice(0, 2) === "he") ? "he" : "en";
            const copy = WIFIGATE_DEMO_COPY[language];
            const locale = language === "he" ? "he-IL" : "en-US";
            const ep = params.getAll("ep").filter(function (value) {
                return value.indexOf(WIFIGATE_DEMO_PREFIX) === 0;
            })[0] || "";
            const demo = readDemoToken(ep);
            const main = document.getElementById("main-content");
            const logo = main.querySelector(".logo");
            const title = demoElement("h1", "", copy.title);
            title.id = "page-title";
            const banner = demoElement("p", "demo-banner", copy.banner);
            banner.id = "demo-banner";
            const parts = [title, banner];
            if (demo) {
                const system = WIFIGATE_DEMO_SYSTEMS[demo.k];
                const format = new Intl.DateTimeFormat(locale, {
                    weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
                });
                const phone = demoElement("div", "demo-phone");
                const tile = demoElement("div", "demo-tile");
                const icon = demoElement("span", "demo-icon");
                const image = document.createElement("img");
                image.alt = "";
                image.src = (logo ? logo.getAttribute("src") : "/assets/img/wifigate-link-logo.webp")
                    .replace("assets/img/wifigate-link-logo.webp", "assets/host-icons/" + system.icon + ".svg");
                icon.append(image);
                const text = demoElement("div");
                const name = demoElement("p", "demo-name");
                name.append(demoElement("bdi", "", system.name));
                text.append(name, demoElement("span", "demo-guest", copy.guest));
                tile.append(icon, text);
                // Each end of the stay stays on one line; a narrow screen breaks at the arrow.
                const stay = demoElement("p", "demo-window");
                stay.append(
                    demoElement("span", "demo-when", format.format(new Date(demo.ss))),
                    language === "he" ? " ← " : " → ",
                    demoElement("span", "demo-when", format.format(new Date(demo.se))));
                stay.id = "demo-window";
                phone.append(tile, stay);
                parts.push(phone);
            } else {
                const status = demoElement("p", "", copy.incomplete);
                status.id = "status";
                parts.push(status);
            }
            const more = demoElement("a", "secondary", copy.more);
            more.href = language === "he" ? "/he/" : "/";
            const actions = demoElement("div", "actions");
            actions.append(more);
            parts.push(actions);
            document.title = copy.title;
            document.documentElement.lang = language;
            document.documentElement.dir = language === "he" ? "rtl" : "ltr";
            main.dataset.demo = "true";
            main.replaceChildren.apply(main, (logo ? [logo] : []).concat(parts));
            return true;
        }

        document.addEventListener("DOMContentLoaded", function () {
            if (showDemoPreview()) {
                return;
            }
            scheduleAppOpen(buildDeepLink());
        });
    </script>

<body>
    <a class="skip-link" href="#main-content">跳到主要內容</a>
    <main class="card" id="main-content" tabindex="-1">
        <img class="logo" src="../../assets/img/wifigate-link-logo.webp" alt="WIFIGATE" width="84" height="84">
        <h1 id="page-title">正在開啟 WIFIGATE</h1>
        <p id="status">我們正在嘗試在應用程式中開啟您的邀請。</p>
        <div id="spinner" class="spinner" aria-hidden="true"></div>
        <div class="actions">
            <a id="open-app" class="button" href="#" hidden="">在 WIFIGATE 中開啟</a>
            <button id="copy-link" class="secondary" type="button" hidden="">複製應用程式連結</button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    </main>
    <p class="statement"><a id="accessibility-statement-link" href="/zh-hant/accessibility/">無障礙聲明</a></p>
    <button class="a11y-fab" id="a11y-fab" type="button" aria-controls="a11y-panel" aria-expanded="false" aria-haspopup="dialog" aria-label="開啟無障礙選單" title="開啟無障礙選單">
