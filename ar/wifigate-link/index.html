    <style>
        :root {
            --bg: #f7f7f4;
            --panel: rgba(255, 255, 255, 0.94);
            --text: #10241d;

            --accent: #0f766e;
            --accent-strong: #115e59;

            --shadow: 0 18px 48px rgba(16, 36, 29, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: var(--bg);
            display: none;
            place-items: center;
            padding: 24px;
        }

        body.ready {
            display: grid;
        }

        .card {
            width: min(100%, 420px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 28px 24px;
            text-align: center;
        }

        .logo {
            width: 84px;
            height: 84px;
            border-radius: 24px;
            display: block;
            margin: 0 auto 18px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 5vw, 32px);
            line-height: 1.08;
        }

        p {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.55;
        }

        .actions {
            display: grid;
            gap: 12px;
            margin-top: 24px;
        }

        .button,
        .secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 50px;
            border-radius: 999px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .button {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(15, 118, 110, 0.22);
        }

        .secondary {
            border: 1px solid rgba(16, 36, 29, 0.12);
            color: var(--text);
            background: rgba(255, 255, 255, 0.82);
        }

        .button:hover,
        .secondary:hover {
            transform: translateY(-1px);
        }
    </style>
    <script id="wifigate-link-copy" type="application/json">{"statusOpening":"نحاول فتح دعوتك داخل التطبيق.","statusMissing":"رابط الدعوة هذا يفتقد بيانات الوصول. اطلب من المرسل مشاركته مرة أخرى.","statusFallback":"إذا لم يتم فتح WiFiGate تلقائيا، فاستخدم الزر أدناه.","copyButton":"انسخ رابط التطبيق","copiedButton":"تم نسخ رابط التطبيق"}</script>
    <script>
        const WIFIGATE_LINK_DEFAULT_COPY = {
            statusOpening: "We are trying to open your invitation in the app.",
            statusMissing: "This invitation link is missing the access details. Ask the sender to share it again.",
            statusFallback: "If WiFiGate did not open automatically, use the button below.",
            copyButton: "Copy app link",
            copiedButton: "Copied app link"
        };

        function getUtilityPageCopy() {
            const script = document.getElementById("wifigate-link-copy");
            if (!script) {
                return WIFIGATE_LINK_DEFAULT_COPY;
            }

            try {
                return {
                    ...WIFIGATE_LINK_DEFAULT_COPY,
                    ...JSON.parse(script.textContent || "{}")
                };
            } catch (error) {
                return WIFIGATE_LINK_DEFAULT_COPY;
            }
        }

        function firstNonEmpty() {
            for (const value of arguments) {
                if (typeof value === "string" && value.trim()) {
                    return value.trim();
                }
            }
            return "";
        }

        function buildDeepLink() {
            const currentUrl = new URL(window.location.href);
            const params = currentUrl.searchParams;
            const directLink = firstNonEmpty(params.get("link"));
            if (directLink) {
                return directLink;
            }

            const pathSegments = currentUrl.pathname
                .split("/")
                .filter(Boolean)
                .map((segment) => decodeURIComponent(segment));

            const groupId = firstNonEmpty(
                params.get("gid"),
                params.get("groupId"),
                pathSegments[0] === "group" ? pathSegments[1] : ""
            );

            const dualControlId = firstNonEmpty(
                params.get("dcid"),
                params.get("dualControlId"),
                pathSegments[0] === "dual-control" ? pathSegments[1] : ""
            );

            if (dualControlId) {
                params.delete("link");
                if (!params.has("dcid")) {
                    params.set("dcid", dualControlId);
                }
                if (!params.has("id")) {
                    params.set("id", dualControlId);
                }

                const query = params.toString();
                return `wifigate://dual-control/${encodeURIComponent(dualControlId)}${query ? `?${query}` : ""}`;
            }

            if (groupId) {
                params.delete("link");
                if (!params.has("gid")) {
                    params.set("gid", groupId);
                }
                if (!params.has("id")) {
                    params.set("id", groupId);
                }

                const query = params.toString();
                return `wifigate://group/${encodeURIComponent(groupId)}${query ? `?${query}` : ""}`;
            }

            const gateId = firstNonEmpty(
                params.get("i"),
                params.get("id"),
                params.get("chip")
            );

            const routeId = gateId || (params.get("ep") ? "invite" : "");
            if (!routeId) {
                return "";
            }

            params.delete("link");
            if (!params.has("id")) {
                params.set("id", routeId);
            }

            const query = params.toString();
            return `wifigate://gate/${encodeURIComponent(routeId)}${query ? `?${query}` : ""}`;
        }

        function revealFallback(deepLink, statusText) {
            const copy = getUtilityPageCopy();
            const status = document.getElementById("status");
            const openApp = document.getElementById("open-app");
            const copyLink = document.getElementById("copy-link");

            status.textContent = statusText || copy.statusOpening;
            openApp.hidden = !deepLink;
            copyLink.hidden = !deepLink;
            openApp.href = deepLink || "#";
            copyLink.textContent = copy.copyButton;
            copyLink.onclick = async function () {
                if (!deepLink) {
                    return;
                }

                try {
                    await navigator.clipboard.writeText(deepLink);
                    copyLink.textContent = copy.copiedButton;
                } catch (error) {
                    console.error("Failed to copy deep link", error);
                }
            };

            document.body.classList.add("ready");
        }

        function openImmediately(deepLink) {
            const copy = getUtilityPageCopy();

            if (!deepLink) {
                revealFallback("", copy.statusMissing);
                return;
            }

            window.setTimeout(function () {
                revealFallback(deepLink, copy.statusFallback);
            }, 900);

            window.setTimeout(function () {
                window.location.replace(deepLink);
            }, 40);
        }

        document.addEventListener("DOMContentLoaded", function () {
            openImmediately(buildDeepLink());
        });
    </script>
