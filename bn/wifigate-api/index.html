    <style>
        :root {
            --bg: #edf2f8;
            --panel: #ffffff;
            --text: #152238;
            --muted: #526176;
            --accent: #0b63ff;
            --accent-strong: #2563eb;
            --border: #d9e2ee;
            --shadow: 0 18px 48px rgba(25, 50, 90, 0.10);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: var(--bg);
            display: grid;
            place-items: center;
            padding: 20px;
        }

        .card {
            width: min(100%, 400px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 32px 28px;
            text-align: center;
        }

        .logo {
            width: 84px;
            height: 84px;
            border-radius: 24px;
            display: block;
            margin: 0 auto 24px;
        }

        h1 {
            margin: 0;
            font-size: clamp(24px, 6vw, 30px);
            line-height: 1.18;
        }

        p {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.55;
        }

        .spinner {
            width: 24px;
            height: 24px;
            margin: 28px auto 0;
            border: 3px solid #dce7f8;
            border-top-color: var(--accent-strong);
            border-radius: 50%;
            animation: spin 850ms linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }

        [hidden] { display: none !important; }

        .actions {
            display: grid;
            gap: 12px;
            margin-top: 28px;
        }

        .button,
        .secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 52px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }

        .button {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #ffffff;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.20);
        }

        .secondary {
            border: 1px solid var(--border);
            color: var(--text);
            background: #ffffff;
        }

        .button:hover,
        .secondary:hover {
            transform: translateY(-1px);
        }

        .button:focus-visible,
        .secondary:focus-visible {
            outline: 3px solid #173d91;
            outline-offset: 3px;
        }

        .feedback {
            min-height: 24px;
            margin-top: 12px;
            font-size: 14px;
        }

        .feedback:empty { display: none; }

        .feedback.error { color: #a32626; }

        @media (max-width: 360px) {
            body { padding: 14px; }
            .card { padding: 28px 20px; }
        }
    </style>
    <script id="wifigate-link-copy" type="application/json">{"headingFallback":"WiFiGate-এ খুলুন","headingMissing":"WiFiGate-এ খুলুন","statusMissing":"এই আমন্ত্রণ লিঙ্কে প্রবেশের তথ্য নেই। প্রেরককে এটি আবার শেয়ার করতে বলুন।","statusFallback":"যদি WiFiGate স্বয়ংক্রিয়ভাবে না খোলে, তাহলে নিচের বোতামটি ব্যবহার করুন।","copyButton":"অ্যাপ লিঙ্ক কপি করুন","copiedButton":"অ্যাপ লিঙ্ক কপি করা হয়েছে","copyError":"Couldn't copy link. Please try again."}</script>
    <script>
        const WIFIGATE_LINK_DEFAULT_COPY = {
            headingFallback: "Continue in WiFiGate",
            statusMissing: "This invitation link is missing the access details. Ask the sender to share it again.",
            statusFallback: "Didn't open automatically? Tap below to try again.",
            copyButton: "Copy link",
            copiedButton: "Link copied!",
            copyError: "Couldn't copy link. Please try again."
        };

        function getUtilityPageCopy() {
            const script = document.getElementById("wifigate-link-copy");
            if (!script) {
                return WIFIGATE_LINK_DEFAULT_COPY;
            }

            try {
                return {
                    ...WIFIGATE_LINK_DEFAULT_COPY,
                    ...JSON.parse(script.textContent || "{}")
                };
            } catch (error) {
                return WIFIGATE_LINK_DEFAULT_COPY;
            }
        }

        function firstNonEmpty() {
            for (const value of arguments) {
                if (typeof value === "string" && value.trim()) {
                    return value.trim();
                }
            }
            return "";
        }

        function buildDeepLink() {
            const currentUrl = new URL(window.location.href);
            const params = currentUrl.searchParams;
            const directLink = firstNonEmpty(params.get("link"));
            if (directLink) {
                return directLink;
            }

            const pathSegments = currentUrl.pathname
                .split("/")
                .filter(Boolean)
                .map((segment) => decodeURIComponent(segment));

            const groupId = firstNonEmpty(
                params.get("gid"),
                params.get("groupId"),
                pathSegments[0] === "group" ? pathSegments[1] : ""
            );

            const dualControlId = firstNonEmpty(
                params.get("dcid"),
                params.get("dualControlId"),
                pathSegments[0] === "dual-control" ? pathSegments[1] : ""
            );

            if (dualControlId) {
                params.delete("link");
                if (!params.has("dcid")) {
                    params.set("dcid", dualControlId);
                }
                if (!params.has("id")) {
                    params.set("id", dualControlId);
                }

                const query = params.toString();
                return `wifigate://dual-control/${encodeURIComponent(dualControlId)}${query ? `?${query}` : ""}`;
            }

            if (groupId) {
                params.delete("link");
                if (!params.has("gid")) {
                    params.set("gid", groupId);
                }
                if (!params.has("id")) {
                    params.set("id", groupId);
                }

                const query = params.toString();
                return `wifigate://group/${encodeURIComponent(groupId)}${query ? `?${query}` : ""}`;
            }

            const gateId = firstNonEmpty(
                params.get("i"),
                params.get("id"),
                params.get("chip")
            );

            const routeId = gateId || (params.get("ep") ? "invite" : "");
            if (!routeId) {
                return "";
            }

            params.delete("link");
            if (!params.has("id")) {
                params.set("id", routeId);
            }

            const query = params.toString();
            return `wifigate://gate/${encodeURIComponent(routeId)}${query ? `?${query}` : ""}`;
        }

        function revealFallback(deepLink) {
            const copy = getUtilityPageCopy();
            const title = document.getElementById("page-title");
            const status = document.getElementById("status");
            const spinner = document.getElementById("spinner");
            const openApp = document.getElementById("open-app");
            const copyLink = document.getElementById("copy-link");
            const feedback = document.getElementById("feedback");

            title.textContent = deepLink ? copy.headingFallback : copy.headingMissing;
            status.textContent = deepLink ? copy.statusFallback : copy.statusMissing;
            spinner.hidden = true;
            openApp.hidden = !deepLink;
            copyLink.hidden = !deepLink;
            openApp.href = deepLink || "#";
            copyLink.textContent = copy.copyButton;
            copyLink.onclick = async function () {
                if (!deepLink) {
                    return;
                }

                feedback.textContent = "";
                feedback.classList.remove("error");
                try {
                    await navigator.clipboard.writeText(deepLink);
                    feedback.textContent = copy.copiedButton;
                } catch (error) {
                    feedback.textContent = copy.copyError;
                    feedback.classList.add("error");
                }
            };
        }

        function openImmediately(deepLink) {
            if (!deepLink) {
                revealFallback("");
                return;
            }

            window.setTimeout(function () {
                if (document.visibilityState === "visible") {
                    revealFallback(deepLink);
                } else {
                    document.addEventListener("visibilitychange", function showOnReturn() {
                        if (document.visibilityState === "visible") {
                            document.removeEventListener("visibilitychange", showOnReturn);
                            revealFallback(deepLink);
                        }
                    });
                }
            }, 900);

            window.setTimeout(function () {
                window.location.replace(deepLink);
            }, 40);
        }

        document.addEventListener("DOMContentLoaded", function () {
            openImmediately(buildDeepLink());
        });
    </script>
