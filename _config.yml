# GitHub Pages (Jekyll) publishes the repository root. Only the website
# itself goes out: sources and tooling are excluded from wifigate.io.
# Internal documentation belongs outside this public repository.
exclude:
  - docs/
  - scripts/
  - templates/
  - api/
  - backend/
  - node_modules/
  - README.md
  - DEPENDENCY_AUDIT.md
  - package.json
  - package-lock.json
  - tsconfig.json
  - firebase.staging.json
  - favicon-html-snippet.txt
  # Image sources: the site serves the WebP/JPG derivatives made from them.
  - assets/wifigate_niche_pages/*.png
  - assets/wifigate_watermark/
  - assets/img/private-access-arrival.png
  - assets/img/wifigate-product-v3.png
  - assets/img/wifigate-system-overview.png
  - assets/wifigate_niche_pages/app-edits.md
