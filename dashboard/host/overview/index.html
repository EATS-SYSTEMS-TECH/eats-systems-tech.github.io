<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <script src="/js/legacy-platform-redirect.js?v=20261029orgmanage1" data-product="host"></script>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>WIFIGATE Host</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/css/host-portal.css?v=20261014w3" />
    <link rel="stylesheet" href="/css/platform.css?v=20261029admintoggle1" />
    <link rel="stylesheet" href="/css/host-dashboard.css?v=20261024emptysystems1" />
    <link rel="stylesheet" href="/css/host-admin.css?v=20261014w6" />
    <link rel="stylesheet" href="/css/cookie-consent.css?v=20261007c" />
    <link rel="stylesheet" href="/css/dashboard-header.css?v=20261029website1" />
    <link rel="stylesheet" href="/css/host-manager-theme.css?v=20261029orgmanage1" />
    <script
      type="module"
      src="/js/host-dashboard.bundle.js?v=20261029website1"
    ></script>
  </head>
  <body class="host-app portal-dashboard platform-page host-manager-workspace" data-product="host">
    <a
      class="workspace-skip-link"
      href="#workspace-main"
      data-host-copy="Skip to workspace"
      >Skip to workspace</a
    >

    <div class="platform-shell host-manager-page">
    <header class="host-topbar platform-header">
      <div class="host-topbar__start">
        <button
          class="workspace-menu-toggle"
          type="button"
          aria-controls="host-sidebar"
          aria-expanded="false"
          aria-label="Menu"
          data-host-label="Menu"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <a
          class="brand host-topbar__brand"
          href="/dashboard/host/"
          aria-label="WIFIGATE home"
          data-host-label="WIFIGATE home"
          ><img
            src="/assets/img/wifigate-horizontal-logo.webp"
            alt="WIFIGATE"
            width="416"
            height="96"
        /></a>
        <h1 id="workspace-current-view" class="host-topbar__title">
          WIFIGATE Host
        </h1>
      </div>
      <div id="product-switcher" class="product-switcher"></div>
      <div class="host-topbar__end">
          <a class="dashboard-website-link" href="/" aria-label="WIFIGATE Website" title="WIFIGATE Website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a17 17 0 0 1 0 18 17 17 0 0 1 0-18Z"/></svg><span dir="ltr">WIFIGATE Website</span></a>
        <button
          id="join-organization"
          class="host-icon-button host-bell"
          type="button"
          aria-label="Join an organization"
          data-host-label="Join an organization"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20a2 2 0 0 0 4 0" />
          </svg>
          <span class="host-bell__count" data-invitation-count></span>
        </button>
        <button
          id="host-language"
          class="host-language"
          type="button"
          data-host-language
        ></button>
        <div class="host-account">
          <button
            id="account-button"
            class="host-account__button dashboard-profile-button"
            type="button"
            aria-haspopup="dialog"
            aria-controls="account-menu"
            aria-label="Account"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
          </button>
          <div id="account-menu" class="host-account__menu dashboard-profile-panel" role="dialog" aria-label="My profile" data-host-label="My profile" tabindex="-1" hidden="">
            <a id="host-profile-link" class="dashboard-profile-identity" href="/dashboard/" data-products-link>
              <span id="account-avatar" class="platform-avatar" aria-hidden="true"></span>
              <div><strong id="account-name" dir="auto"></strong><span id="account-email" dir="ltr"></span></div>
            </a>
            <div id="account-plan" class="dashboard-profile-roles"></div>
            <button
              id="account-security"
              class="host-account__item"
              type="button"
              data-host-copy="Account and security"
            >
              Account and security
            </button>
            <button
              id="sign-out"
              class="host-account__item host-account__sign-out"
              type="button"
              disabled=""
              data-host-copy="Sign out"
            >
              Sign out
            </button>
          </div>
        </div>
      </div>
    </header>
    <div class="host-scrim" hidden=""></div>
    <div id="host-workspace-shell" class="manager-shell host-manager-shell" data-mode="workspace">
    <aside
      id="host-sidebar"
      class="host-sidebar manager-nav"
      hidden=""
      aria-label="Host navigation"
      data-host-label="Host navigation"
    >
      <a
        class="brand host-sidebar__brand"
        href="/dashboard/host/"
        aria-label="WIFIGATE home"
        data-host-label="WIFIGATE home"
        ><img
          src="/assets/img/wifigate-horizontal-logo.webp"
          alt="WIFIGATE"
          width="416"
          height="96"
      /></a>
      <p class="manager-nav-title" data-host-copy="Workspace">Workspace</p>
      <div id="host-workspace-roles" class="manager-sidebar-roles" hidden></div>
      <nav
        id="host-section-navigation"
        aria-label="Dashboard sections"
        data-host-label="Dashboard sections"
      ></nav>
      <div id="workspace-org-switcher" class="org-switcher" hidden=""></div>
      <section
        id="host-my-systems"
        class="sidebar-systems"
        aria-labelledby="sidebar-systems-title"
        hidden=""
      >
        <h2 id="sidebar-systems-title" data-host-copy="My systems">
          My systems
        </h2>
        <ul id="host-my-systems-list" class="sidebar-systems__list"></ul>
      </section>
    </aside>
    <main id="workspace-main" class="portal-shell manager-main" tabindex="-1">
      <span class="staging-badge" data-staging="" hidden="">LOCAL STAGING</span>
      <section
        id="access-panel"
        class="portal-panel host-access"
        aria-labelledby="access-title"
      >
        <h2 id="access-title" data-host-copy="Opening WIFIGATE Host">
          Opening WIFIGATE Host
        </h2>
        <p
          id="dashboard-status"
          role="status"
          aria-live="polite"
          data-host-copy="Checking your access…"
        >
          Checking your access…
        </p>
        <div
          id="access-progress"
          class="app-login__progress"
          role="progressbar"
          aria-label="Loading"
          data-host-label="Loading"
        >
          <span></span>
        </div>
        <button
          id="refresh-access"
          type="button"
          hidden=""
          data-host-copy="Check again"
        >
          Check again
        </button>
      </section>
      <div id="dashboard-content" class="manager-view" hidden="">
        <section
          id="admin-overview"
          class="portal-panel"
          aria-label="Administrator overview"
          hidden=""
          data-host-label="Administrator overview"
        ></section>
        <section
          id="host-management"
          class="portal-panel"
          aria-label="Organization management"
          data-host-label="Organization management"
        ></section>
      </div>
    </main>
    </div>
    <div id="host-platform-navigation" class="host-platform-tools"></div>
    <nav class="portal-legal" aria-label="Legal" data-host-label="Legal">
      <a href="/terms-and-conditions/" data-host-copy="Terms &amp; Conditions"
        >Terms &amp; Conditions</a
      ><a href="/privacy-policy/" data-host-copy="Privacy Policy"
        >Privacy Policy</a
      ><a href="/cookies/" data-host-copy="Cookie Policy">Cookie Policy</a
      ><a href="/accessibility/" data-host-copy="Accessibility Statement"
        >Accessibility Statement</a
      >
    </nav>
    </div>
    <nav
      id="host-tabbar"
      class="host-tabbar"
      aria-label="Main sections"
      data-host-label="Main sections"
      hidden=""
    ></nav>
    <dialog
      id="mfa-challenge"
      class="mfa-dialog"
      aria-labelledby="challenge-title"
    >
      <form class="mfa-dialog__form">
        <img
          class="mfa-dialog__logo"
          src="/assets/img/wifigate-horizontal-logo.webp"
          alt="WIFIGATE"
          width="416"
          height="96"
        />
        <h2
          id="challenge-title"
          class="mfa-dialog__title"
          data-host-copy="Verify your authenticator"
        >
          Verify your authenticator
        </h2>
        <label class="mfa-dialog__field mfa-dialog__factor"
          ><span data-host-copy="Authenticator">Authenticator</span
          ><select name="factor" required=""></select
        ></label>
        <label class="mfa-dialog__field"
          ><span data-host-copy="Verification code">Verification code</span
          ><input
            class="mfa-dialog__code"
            name="code"
            dir="ltr"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            placeholder="••••••"
            spellcheck="false"
            required=""
        /></label>
        <p class="mfa-dialog__status" role="status" aria-live="polite"></p>
        <div class="mfa-dialog__actions">
          <button
            type="submit"
            class="mfa-dialog__button mfa-dialog__button--primary"
            data-host-copy="Verify"
          >
            Verify</button
          ><button
            type="button"
            class="mfa-dialog__button mfa-dialog__button--secondary"
            data-cancel=""
            data-host-copy="Cancel"
          >
            Cancel
          </button>
        </div>
      </form>
    </dialog>
    <script src="/js/cookie-consent-copy.js?v=20261007c" defer=""></script>
    <script src="/js/cookie-consent.js?v=20261007c" defer=""></script>
  </body>
</html>
