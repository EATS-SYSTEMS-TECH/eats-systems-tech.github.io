name: Update USD-ILS reference rate
on:
  schedule:
    - cron: '17 7-17 * * 0-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: usd-ils-rate
  cancel-in-progress: false
jobs:
  rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read and validate Bank of Israel rate
        run: node scripts/update-usd-ils-rate.mjs
      - name: Publish identical rate to main and develop
        shell: bash
        run: |
          if git diff --quiet -- assets/data/usd-ils-rate.json; then exit 0; fi
          git fetch origin main develop
          test "$(git rev-parse origin/main)" = "$(git rev-parse origin/develop)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/usd-ils-rate.json
          git commit -m "Update Bank of Israel USD-ILS reference rate"
          git push --atomic origin HEAD:main HEAD:develop
